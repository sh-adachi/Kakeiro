name: Check app
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: Backend
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test accounting logic
        run: swift test
      - name: Build iPhone simulator app
        run: bash Scripts/build_simulator.sh
